name: CI pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_USERNAME: 'samson84cc'
  DOCKER_REPO: 'animal-shelter'
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: action/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Docker
        run: docker build -t ${{github.repository}}:${{github.sha}} .
      - name: Test Image
        run: docker run --rm animal-shelter sh -c "python -m pylint . && python -m pytest tests"

