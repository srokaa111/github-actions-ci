name: CI pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_USERNAME: 'srokaa111'
  DOCKER_REPO: 'animal-shelter-ci-test'
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Docker
        run: docker build -t ${{env.DOCKER_USERNAME}}/${{env.DOCKER_REPO}}:${{github.sha}} .
      - name: Test Image
        run: docker run ${{env.DOCKER_USERNAME}}/${{env.DOCKER_REPO}}:${{github.sha}} sh -c "python -m pylint . && python -m pytest tests"
      - name: Login to Docker Hub
        run: echo  ${{secrets.DOCKER_PAT}} | docker login -u ${{env.DOCKER_USERNAME}} --password-stdin
      - name: Push to Docker Hub
        run: docker push ${{env.DOCKER_USERNAME}}/${{env.DOCKER_REPO}}:${{github.sha}}

